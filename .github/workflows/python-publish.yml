name: Upload Python Package
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  release-build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - name: Install build dependencies
        run: pip install setuptools wheel Cython numpy
      - name: Build release distributions
        run: uv build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-macos-${{ matrix.python-version }}
          path: dist/

  release-build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build manylinux wheels
        uses: pypa/cibuildwheel@v2.22.0
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-win* *-musllinux*"
          CIBW_BEFORE_BUILD: "pip install setuptools wheel Cython numpy"
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists-linux
          path: wheelhouse/

  pypi-publish:
    runs-on: ubuntu-latest
    needs: [release-build-macos, release-build-linux]
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          pattern: release-dists-*
          merge-multiple: true
          path: dist/
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true